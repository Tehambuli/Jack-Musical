<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jack Harlow's Wordle</title>

    <link rel="stylesheet" href="css/game.css" />

</head>

<body>

    <!--all containers for the project-->

    <div class="game-container">
        <div class="title-container">
            <h1>Jack Harlow's Wordle</h1>
        </div>
        <div class="message-container"></div>
        <div class="tile-container"></div>
        <div class="key-container .clickevent"></div>
    </div>

    <div class="intro-overlay hidden">
        <div class="intro">
            <div class="close">x</div>
            <h2>How to play</h2>
            <p>Enter each letter trying to complete a song name</p>

            <div class="examples">
                <div class="tile-container">
                    <div id="guessRow-2" class="correct">
                        <div id="guessRow-2-tile-0" class="tile">N</div>
                        <div id="guessRow-2-tile-1" class="tile">I</div>
                        <div id="guessRow-2-tile-2" class="tile">G</div>
                        <div id="guessRow-2-tile-3" class="tile">H</div>
                        <div id="guessRow-2-tile-4" class="tile">T</div>
                        <div id="guessRow-2-tile-5" class="tile"></div>
                        <div id="guessRow-2-tile-6" class="tile"></div>
                    </div>
                </div>
            </div>

            <p>This is a valid one!</p>

            <div class="examples">
                <div class="tile-container">
                    <div id="guessRow-3" class="incorrect">
                        <div id="guessRow-3-tile-0" class="tile" data="T">T</div>
                        <div id="guessRow-3-tile-1" class="tile" data="E">E</div>
                        <div id="guessRow-3-tile-2" class="tile" data="S">S</div>
                        <div id="guessRow-3-tile-3" class="tile"></div>
                        <div id="guessRow-3-tile-4" class="tile"></div>
                        <div id="guessRow-3-tile-5" class="tile"></div>
                        <div id="guessRow-3-tile-6" class="tile"></div>
                    </div>
                </div>
            </div>
            <p>This one is wrong!</p>

            <h3>Got it?</h3>
            <button class="start-game">Click here to start</button>
        </div>
    </div>

    <div class="text-center">
        <button class="reset">Reset game</button>
    </div>

        <iframe width="916" height="515" src="https://www.youtube.com/embed/vq4hRDnGbDY"

        frameborder="0" allow="accelerometer; autoplay; clipboard-write; 
        encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>--->

    <!--JS Added section-->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
